name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --cwd my-workflow --frozen-lockfile
      - run: bun test --cwd my-workflow
      - run: bun run --cwd my-workflow typecheck

